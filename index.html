function GNB({ tab, setTab, onProduct, productSub }) {
  const tabOf = { "은행소개": "bank", "고객센터": "faq", "새소식&블로그": "news" };

/* ── 리소스 센터: 스크롤 진입 시 섹션이 차분히 떠오르는 reveal ── */
function Reveal({ children, delay = 0, enabled = true }) {
  const ref = useRef(null);
  const [shown, setShown] = useState(false);
  useEffect(() => {
    if (!enabled) return;
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver(
      ([e]) => { if (e.isIntersecting) { setShown(true); io.disconnect(); } },
      { threshold: 0.12, rootMargin: "0px 0px -8% 0px" }
    );
    io.observe(el);
    return () => io.disconnect();
  }, [enabled]);
  if (!enabled) {
    return <div>{children}</div>;
  }
  return (
    <div ref={ref} style={{
      opacity: shown ? 1 : 0,
      transform: shown ? "translateY(0)" : `translateY(${PAGE.rise}px)`,
      transition: `opacity ${PAGE.duration}ms ${PAGE.easing} ${delay}ms, transform ${PAGE.duration}ms ${PAGE.easing} ${delay}ms`,
    }}>{children}</div>
  );
}

function ResSection({ title, desc, children, reveal = true }) {

        {children}
      </section>
    </Reveal>
  );
}

function AccordionItem({ item, isOpen, onToggle, isLast, scrollSmooth = true, autoScroll = true }) {
  const panelId = useId(), btnId = useId();
  const [hover, setHover] = useState(false);
  const itemRef = useRef(null), mounted = useRef(false);
  useEffect(() => {
    if (!mounted.current) { mounted.current = true; return; }
    if (autoScroll && isOpen && itemRef.current) {
      const t = setTimeout(() => itemRef.current.scrollIntoView({ behavior: scrollSmooth ? "smooth" : "auto", block: "start" }), MOTION.duration + 30);
      return () => clearTimeout(t);
    }
  }, [isOpen]);
  return (
    <div ref={itemRef} style={{ borderBottom: isLast ? "none" : `1px solid ${T.borderQuinary}`, scrollMarginTop: 88 }}>
      <button id={btnId} aria-expanded={isOpen} aria-controls={panelId} onClick={onToggle} onMouseEnter={() => setHover(true)} onMouseLeave={() => setHover(false)}
        style={{ width: "100%", appearance: "none", border: "none", background: hover ? T.dimThin : "transparent", font: "inherit", textAlign: "left", cursor: "pointer", display: "flex", alignItems: "center", gap: 14, padding: "24px 16px", borderRadius: T.radiusSm, transition: "background 140ms ease" }}>
        <span style={{ color: T.primary, fontWeight: 700, fontSize: 16, flex: "none", width: 18 }}>Q</span>
        <span style={{ flex: 1, fontSize: 16, fontWeight: 500, color: T.fgBase, letterSpacing: "-0.3px" }}>
          {item.kind && <Badge spec={item.kind === "spec"} />}
          <span style={{ color: T.accent, fontWeight: 600 }}>[{item.tag}]</span> {item.q}
        </span>
        <svg viewBox="0 0 24 24" fill="none" style={{ flex: "none", width: 22, height: 22, color: hover ? T.fgSecondary : T.fgTertiary, transform: isOpen ? "rotate(180deg)" : "rotate(0deg)", transition: `transform ${MOTION.duration}ms ${MOTION.easing}, color 140ms ease` }}>
          <path d="M6 9L12 15L18 9" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" />
        </svg>
      </button>
      <div id={panelId} role="region" aria-labelledby={btnId} style={{ display: "grid", gridTemplateRows: isOpen ? "1fr" : "0fr", transition: `grid-template-rows ${MOTION.duration}ms ${MOTION.easing}` }}>
        <div style={{ overflow: "hidden" }}>
          <div style={{ margin: "0 0 20px", padding: "24px 28px", background: T.bgSecondary, borderRadius: T.radiusMd, opacity: isOpen ? 1 : 0, transition: isOpen ? `opacity ${MOTION.fadeIn}ms ease ${MOTION.fadeInDelay}ms` : `opacity ${MOTION.fadeOut}ms ease` }}>
            {item.a}
          </div>
        </div>
      </div>
    </div>
  );
}

        </svg>
      </button>
      <div style={{ display: "grid", gridTemplateRows: open ? "1fr" : "0fr", transition: "grid-template-rows 300ms cubic-bezier(0.4,0,0.2,1)" }}>
        <div style={{ overflow: "hidden" }}>
          <div style={{ padding: "0 22px 20px", color: "#d6d9de", fontSize: 13, lineHeight: 1.7, opacity: open ? 1 : 0, transition: open ? "opacity 200ms ease 80ms" : "opacity 120ms ease" }}>
            {sections.map((sec, si) => (
              <div key={si}>
                <div style={{ fontSize: 11, fontWeight: 700, color: "#ccff00", letterSpacing: "0.06em", textTransform: "uppercase", margin: si === 0 ? "4px 0 8px" : "18px 0 8px" }}>{sec.heading}</div>
                {sec.rows.map(([k, v], i, arr) => (
                  <div key={k} style={{ display: "flex", gap: 12, padding: "7px 0", borderBottom: i < arr.length - 1 ? "1px solid #2b2f36" : "none" }}>
                    <span style={{ color: "#8b9097", fontWeight: 600, width: 104, flex: "none" }}>{k}</span>
                    <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 12, color: "#fff" }}>{v}</span>
                  </div>
                ))}
                {sec.note && <div style={{ marginTop: 8, fontSize: 12, color: "#8b9097" }}>{sec.note}</div>}
              </div>
            ))}
            {code && (
              <>
                <div style={{ fontSize: 11, fontWeight: 700, color: "#ccff00", letterSpacing: "0.06em", textTransform: "uppercase", margin: "18px 0 8px" }}>구현 코드</div>
                <pre style={{ margin: 0, padding: "14px 16px", background: "#0f1113", borderRadius: 6, overflowX: "auto", fontFamily: "'JetBrains Mono', monospace", fontSize: 11.5, lineHeight: 1.65, color: "#ccff00" }}>{code}</pre>
              </>
            )}
            {status && <div style={{ marginTop: 12, fontSize: 12, color: "#8b9097" }}>{status}</div>}
          </div>
        </div>
      </div>
    </div>
  );
}

function SpecPage() {
  const [openId, setOpenId] = useState("ac-1");
  const [autoScroll, setAutoScroll] = useState(true);
  const [scrollSmooth, setScrollSmooth] = useState(true);
  const toggle = useCallback((id) => setOpenId((c) => (c === id ? null : id)), []);

  const Switch = ({ on, onToggle, disabled }) => (
    <button role="switch" aria-checked={on} disabled={disabled} onClick={onToggle}
      style={{ appearance: "none", border: "none", cursor: disabled ? "not-allowed" : "pointer", width: 46, height: 26, borderRadius: 999, padding: 3, background: disabled ? "#e8eaed" : (on ? T.primary : T.borderQuatenary), opacity: disabled ? 0.6 : 1, transition: "background 160ms ease" }}>
      <span style={{ display: "block", width: 20, height: 20, borderRadius: "50%", background: "#fff", transform: on ? "translateX(20px)" : "translateX(0)", transition: "transform 160ms cubic-bezier(0.22,0.61,0.36,1)", boxShadow: "0 1px 3px rgba(0,0,0,0.25)" }} />
    </button>
  );

  return (
    <main style={{ maxWidth: 880, margin: "0 auto", padding: "56px 24px 0" }}>
      <h1 className="page-h1" style={{ fontSize: 44, fontWeight: 700, letterSpacing: "-0.5px", color: T.fgBase, margin: "0 0 12px" }}>아코디언 데모</h1>
      <p style={{ margin: "0 0 24px", fontSize: 15, color: T.fgTertiary, lineHeight: 1.6 }}>긴 본문 더미 15개로 구성한 아코디언 목록입니다. 아래 토글로 자동 스크롤 동작을 바꿔가며 펼침·호버·스크롤을 확인하세요.</p>

      {/* 자동 스크롤 컨트롤 — 기능 ON/OFF + 모션 ON/OFF */}
      <div style={{ display: "grid", gap: 1, marginBottom: 24, background: T.borderQuinary, borderRadius: T.radiusSm, overflow: "hidden" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 12, padding: "14px 16px", background: T.bgSecondary }}>
          <span style={{ fontSize: 14, fontWeight: 600, color: T.fgBase }}>자동 스크롤 기능</span>
          <span style={{ fontSize: 12.5, color: T.fgTertiary }}>{autoScroll ? "ON (펼치면 눈높이 이동)" : "OFF (이동 안 함)"}</span>
          <span style={{ marginLeft: "auto" }}><Switch on={autoScroll} onToggle={() => setAutoScroll((v) => !v)} /></span>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 12, padding: "14px 16px", background: T.bgSecondary }}>
          <span style={{ fontSize: 14, fontWeight: 600, color: autoScroll ? T.fgBase : T.placeholder }}>스크롤 모션</span>
          <span style={{ fontSize: 12.5, color: T.fgTertiary }}>{!autoScroll ? "—" : (scrollSmooth ? "smooth (부드럽게)" : "auto (즉시 이동)")}</span>
          <span style={{ marginLeft: "auto" }}><Switch on={scrollSmooth} onToggle={() => setScrollSmooth((v) => !v)} disabled={!autoScroll} /></span>
        </div>
      </div>

      {/* 모션값 + 개발 전달사항 — 접이식 (기본 닫힘) */}
      <DevPanel
        title="모션 수치값 & 개발 전달사항"
        sections={[
          { heading: "① 아코디언 모션 수치값", rows: [
            ["펼침/닫힘 높이", "grid-template-rows 0fr → 1fr · 300ms · cubic-bezier(0.4, 0, 0.2, 1)"],
            ["셰브론 회전", "rotate(0 → 180deg) · 300ms · 동일 easing"],
            ["콘텐츠 등장", "opacity 0 → 1 · 200ms · delay 80ms · ease"],
            ["콘텐츠 사라짐", "opacity 1 → 0 · 120ms · delay 0 · ease"],
          ], note: "※ 호버 딤은 KDS 공통 인터랙션 토큰을 사용 (개별 수치 미정의)" },
          { heading: "② 자동 스크롤 동작", rows: [
            ["메서드", "el.scrollIntoView({ behavior, block: 'start' })"],
            ["기능 ON/OFF", "autoScroll=false면 scrollIntoView 미호출 (화면 고정)"],
            ["behavior", "smooth(부드럽게) ↔ auto(즉시 점프) — 토글로 전환"],
            ["오프셋", "scroll-margin-top: 88px  (GNB 64 + 여백 24)"],
            ["실행 시점", `펼침 트랜지션 종료 후 = ${MOTION.duration} + 30ms`],
            ["초기 렌더", "mounted ref로 스킵 (기본 열림 항목은 스크롤 안 함)"],
            ["트리거", "useEffect([isOpen]) — 열림 전환 시에만"],
          ] },
        ]}
        code={`useEffect(() => {
  if (!mounted.current) { mounted.current = true; return; } // 초기 스킵
  if (autoScroll && isOpen && ref.current) {
    const t = setTimeout(() =>
      ref.current.scrollIntoView({
        behavior: scrollSmooth ? 'smooth' : 'auto',
        block: 'start',
      }), ${MOTION.duration} + 30);
    return () => clearTimeout(t);
  }
}, [isOpen]);

/* CSS */ .item { scroll-margin-top: 88px; }`}
        status={<>현재 상태: 기능 <b style={{ color: autoScroll ? "#ccff00" : "#ff6b6b" }}>{autoScroll ? "ON" : "OFF"}</b> · 모션 <b style={{ color: !autoScroll ? "#555" : "#fff" }}>{!autoScroll ? "—" : (scrollSmooth ? "smooth" : "auto")}</b></>}
      />

      <div style={{ fontSize: 18, fontWeight: 700, color: T.fgBase, marginBottom: 8, borderBottom: `2px solid ${T.fgSecondary}`, paddingBottom: 16 }}>전체 <span style={{ color: T.primary }}>총 {SPEC.length}건</span></div>
      <div>{SPEC.map((item, i) => <AccordionItem key={item.id} item={item} isOpen={openId === item.id} onToggle={() => toggle(item.id)} isLast={i === SPEC.length - 1} scrollSmooth={scrollSmooth} autoScroll={autoScroll} />)}</div>
    </main>
  );
}


function App() {
  const [tab, setTab] = useState("bank");
  const [mode, setMode] = useState("proto"); // proto | spec
  const [pageStage, setPageStage] = useState(2); // 0 없음 · 1 절제 · 2 기본 · 3 강조
  const [subtabMotion, setSubtabMotion] = useState(true);
  const [replay, setReplay] = useState(0); // 재생 트리거
  const [productSub, setProductSub] = useState("예적금");
  const [newsSub, setNewsSub] = useState("전체");

  const STAGES = {
    0: { label: "0단계 · 없음", rise: 0, dur: 0 },
    1: { label: "1단계 · 절제", rise: 8, dur: 400 },
    2: { label: "2단계 · 기본", rise: 16, dur: 600 },
    3: { label: "3단계 · 강조", rise: 32, dur: 800 },
  };
  const stage = STAGES[pageStage];

  const segBtn = (id, label) => {
    const active = mode === id;
    return (
      <button onClick={() => setMode(id)} style={{ appearance: "none", border: "none", font: "inherit", fontSize: 13, fontWeight: 600, padding: "6px 14px", borderRadius: 999, cursor: "pointer", background: active ? "#fff" : "transparent", color: active ? T.fgBase : "#aeb4c0", transition: "background 140ms ease, color 140ms ease" }}>{label}</button>
    );
  };

  // 페이징 모션은 (대메뉴 탭+모드+단계+재생) 변화 시에만 재생
  // ※ 상품 서브탭(productSub)은 제외 — 서브탭 전환은 subtab-rise만 담당
  const riseKey = mode === "spec" ? "spec" : `${tab}-${pageStage}-${replay}`;

  return (
    <div style={{ fontFamily: FONT, background: T.bgBase, minHeight: "100vh", color: T.fgBase, WebkitFontSmoothing: "antialiased" }}>
      <style>{`
        @keyframes pageRise {
          from { opacity: 0; transform: translateY(var(--page-rise, ${PAGE.rise}px)); }
          to   { opacity: 1; transform: translateY(0); }
        }
        .page-rise { animation: pageRise var(--page-dur, ${PAGE.duration}ms) var(--page-ease, ${PAGE.easing}) both; }
        @keyframes subtabRise {
          from { opacity: 0; transform: translateY(12px); }
          to   { opacity: 1; transform: translateY(0); }
        }
        .subtab-rise { animation: subtabRise 460ms ${PAGE.easing} both; }
        @keyframes sloganLineUp {
          from { opacity: 0; transform: translateY(105%); }
          to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes sloganFade {
          from { opacity: 0; transform: translateY(10px); }
          to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes ringPulse {
          0%   { transform: scale(0.96); opacity: 0.55; }
          50%  { transform: scale(1.03); opacity: 0.8; }
          100% { transform: scale(0.96); opacity: 0.55; }
        }
        @media (prefers-reduced-motion: reduce) { .page-rise, .subtab-rise { animation: none; } }

        /* ── 반응형 ───────────────────────────── */
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); }
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); }
        .subtabs { display: flex; }
        .subtabs button { flex: 1; }
        .hamburger { display: none; }

        @media (max-width: 760px) {
          .gnb-nav { display: none !important; }
          .hamburger { display: inline-flex !important; }
          .gnb-cta { display: none !important; }
          .grid-2, .grid-3 { grid-template-columns: 1fr !important; }
          .grid-4 { grid-template-columns: repeat(2, 1fr) !important; }
          .subtabs { overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
          .subtabs::-webkit-scrollbar { display: none; }
          .subtabs button { flex: none !important; padding-left: 14px !important; padding-right: 14px !important; white-space: nowrap; }
          .page-h1 { font-size: 30px !important; }
          .hero-copy { font-size: 19px !important; }
          .slogan-copy { max-width: 100% !important; }
          .dev-row { flex-wrap: wrap; }
          .ctrl-card-row { flex-wrap: wrap; }
          .pad-main { padding-left: 18px !important; padding-right: 18px !important; }
        }

        /* 모바일 드로어 */
        .drawer-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 40; animation: fadeIn 200ms ease both; }
        .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 78%; max-width: 320px; background: #fff; z-index: 41; box-shadow: -8px 0 32px -12px rgba(0,0,0,0.3); animation: drawerIn 280ms cubic-bezier(0.22,0.61,0.36,1) both; overflow-y: auto; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes drawerIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
      `}</style>

      {/* 핸드오프용 모드 토글 (K-Bank 화면 외 컨트롤) */}
      <div style={{ background: "#1a1c1f", color: "#fff", display: "flex", alignItems: "center", justifyContent: "center", gap: 12, padding: "8px 16px" }}>
        <span style={{ fontSize: 12, fontWeight: 600, color: "#8b9097", letterSpacing: "0.02em" }}>K-Bank 프로토타입</span>
        <div style={{ display: "flex", gap: 2, background: "#2b2f36", padding: 3, borderRadius: 999 }}>
          {segBtn("proto", "페이징모션")}
          {segBtn("spec", "아코디언")}
        </div>
      </div>

      <GNB tab={tab} setTab={(t) => { setMode("proto"); setTab(t); }}
        productSub={productSub}
        onProduct={(menu) => { setMode("proto"); setProductSub(menu); setTab("product"); setReplay((v) => v + 1); }} />

      {mode === "proto" && (
        <div style={{ maxWidth: 880, margin: "0 auto", padding: "24px 24px 0" }}>
          {/* 페이징 모션 테스트 컨트롤 */}
          <div style={{ display: "grid", gap: 1, marginBottom: 16, background: T.borderQuinary, borderRadius: T.radiusSm, overflow: "hidden" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 12, padding: "14px 16px", background: T.bgSecondary, flexWrap: "wrap" }}>
              <span style={{ fontSize: 14, fontWeight: 600, color: T.fgBase }}>페이지 전환 단계</span>
              <span style={{ fontSize: 12.5, color: T.fgTertiary }}>{pageStage === 0 ? "모션 없음 (즉시 표시)" : `translateY ${stage.rise}px · ${stage.dur}ms`}</span>
              <div style={{ marginLeft: "auto", display: "flex", gap: 4, background: "#e9ebf0", padding: 3, borderRadius: 999 }}>
                {[0, 1, 2, 3].map((n) => (
                  <button key={n} onClick={() => setPageStage(n)}
                    style={{ appearance: "none", border: "none", cursor: "pointer", font: "inherit", fontSize: 12.5, fontWeight: 600, padding: "6px 14px", borderRadius: 999, background: pageStage === n ? T.primary : "transparent", color: pageStage === n ? "#fff" : T.fgTertiary, transition: "background 140ms ease, color 140ms ease" }}>
                    {STAGES[n].label}
                  </button>
                ))}
              </div>
              <button onClick={() => setReplay((v) => v + 1)}
                style={{ appearance: "none", border: `1px solid ${T.borderQuatenary}`, background: "#fff", cursor: "pointer", font: "inherit", fontSize: 12.5, fontWeight: 600, padding: "7px 12px", borderRadius: T.radiusSm, color: T.fgSecondary }}>
                ↻ 다시 재생
              </button>
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 12, padding: "14px 16px", background: T.bgSecondary }}>
              <span style={{ fontSize: 14, fontWeight: 600, color: T.fgBase }}>서브탭 전환 모션</span>
              <span style={{ fontSize: 12.5, color: T.fgTertiary }}>{subtabMotion ? "ON (브랜드↔리소스 전환 시 등장)" : "OFF (즉시 전환)"}</span>
              <button role="switch" aria-checked={subtabMotion} onClick={() => setSubtabMotion((v) => !v)}
                style={{ marginLeft: "auto", appearance: "none", border: "none", cursor: "pointer", width: 46, height: 26, borderRadius: 999, padding: 3, background: subtabMotion ? T.primary : T.borderQuatenary, transition: "background 160ms ease" }}>
                <span style={{ display: "block", width: 20, height: 20, borderRadius: "50%", background: "#fff", transform: subtabMotion ? "translateX(20px)" : "translateX(0)", transition: "transform 160ms cubic-bezier(0.22,0.61,0.36,1)", boxShadow: "0 1px 3px rgba(0,0,0,0.25)" }} />
              </button>
            </div>
          </div>

          <DevPanel
            title="페이징 모션 — 수치값 & 개발 전달사항"
            sections={[
              { heading: "① 페이지 전환 (탭/페이지 단위)", rows: [
                ["transform", pageStage === 0 ? "none (모션 없음)" : `translateY(${stage.rise}px → 0)  /* Y값만 */`],
                ["opacity", pageStage === 0 ? "1 (즉시)" : "0 → 1"],
                ["duration", pageStage === 0 ? "0ms" : `${stage.dur}ms  /* ${stage.label} */`],
                ["easing", "cubic-bezier(0.22, 0.61, 0.36, 1)  /* 감속·무튕김 */"],
                ["트리거", "key={tab} remount → .page-rise 재생"],
                ["reduced-motion", "애니메이션 제거"],
              ], note: "※ 상단 단계 버튼으로 0(없음) / 8 / 16 / 32px · 0 / 400 / 600 / 800ms 비교" },
              { heading: "② 서브탭 전환 (브랜드↔리소스)", rows: [
                ["상태", subtabMotion ? "ON" : "OFF (즉시 전환)"],
                ["transform", "translateY(12px → 0)"],
                ["opacity", "0 → 1"],
                ["duration", "460ms"],
                ["easing", "cubic-bezier(0.22, 0.61, 0.36, 1)"],
                ["트리거", "key={sub} remount · OFF면 클래스 미적용"],
              ] },
              { heading: "③ 섹션 스크롤 등장 (리소스센터)", rows: [
                ["상태", subtabMotion ? "ON" : "OFF (즉시 표시·모션 없음)"],
                ["transform", "translateY(16px → 0)"],
                ["opacity", "0 → 1"],
                ["duration", "600ms"],
                ["트리거", "IntersectionObserver · threshold 0.12"],
                ["rootMargin", "0px 0px -8% 0px  /* 살짝 일찍 발동 */"],
                ["1회성", "isIntersecting 후 disconnect"],
              ], note: "※ 서브탭 전환 모션 OFF 시 섹션 등장도 함께 비활성 (즉시 표시)" },
            ]}
            code={`/* CSS 변수로 단계 제어 */
@keyframes pageRise {
  from { opacity:0; transform: translateY(var(--page-rise, 16px)); }
  to   { opacity:1; transform: translateY(0); }
}
.page-rise { animation: pageRise var(--page-dur, 600ms)
             cubic-bezier(.22,.61,.36,1) both; }

// 현재 단계: ${stage.label} → --page-rise:${stage.rise}px · --page-dur:${stage.dur}ms
<div key={tab} className="page-rise"
     style={{ '--page-rise': '${stage.rise}px', '--page-dur': '${stage.dur}ms' }}>
  {page}
</div>`}
            status={<>현재: <b style={{ color: "#ccff00" }}>{stage.label}</b> · 서브탭 모션 <b style={{ color: subtabMotion ? "#ccff00" : "#ff6b6b" }}>{subtabMotion ? "ON" : "OFF"}</b></>}
          />
        </div>
      )}

      <div key={riseKey} className="page-rise" style={{ "--page-rise": `${stage.rise}px`, "--page-dur": `${stage.dur}ms` }}>
        {mode === "spec" ? <SpecPage /> : (tab === "bank" ? <BankIntro subtabMotion={subtabMotion} /> : tab === "product" ? <ProductGuide sub={productSub} setSub={setProductSub} subtabMotion={subtabMotion} /> : tab === "news" ? <NewsBlog sub={newsSub} setSub={setNewsSub} subtabMotion={subtabMotion} /> : <SpecPage />)}
        <Footer />
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
